name: Release

# Every push to main ships a new version to both devices.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "supabase/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  # Skips the build (instead of failing) until the signing secrets are added in repo settings.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          A: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          B: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          C: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::warning::Signing secrets not set yet, skipping release."; fi

  windows:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Set version
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/Jarvis-setup.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/Jarvis-setup.exe.sig
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out }

  android:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install NDK (runner's preinstalled Android SDK)
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Set version
        run: |
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          BT=$ANDROID_SDK_ROOT/build-tools/35.0.0
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          mkdir out
          $BT/apksigner sign --ks release.jks --ks-key-alias jarvis --ks-pass env:KS_PASS --key-pass env:KS_PASS --out out/Jarvis.apk aligned.apk
          rm release.jks
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out }

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Write update feed
        env:
          REPO: ${{ github.repository }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          BASE="https://github.com/$REPO/releases/download/v$VERSION"
          jq -n --arg v "$VERSION" --arg notes "${NOTES:-Update}" --arg date "$(date -u +%FT%TZ)" \
                --arg sig "$(cat dist/windows/Jarvis-setup.exe.sig)" --arg base "$BASE" '{
            version: $v, notes: $notes, pub_date: $date,
            platforms: { "windows-x86_64": { signature: $sig, url: "\($base)/Jarvis-setup.exe" } },
            android: { url: "\($base)/Jarvis.apk" }
          }' > latest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION" --repo "$REPO" --title "Jarvis $VERSION" --notes "${NOTES:-Update}" \
            dist/windows/Jarvis-setup.exe dist/windows/Jarvis-setup.exe.sig dist/android/Jarvis.apk latest.json
